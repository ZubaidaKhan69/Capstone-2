<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio |Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
    </header>
    
    <main id="main-content">
        <section>
            <h1>Get in Touch</h1>
            <h2>Have a Question or Want to Work Together?</h2>
            <p>If you would like to get in touch, please fill out the form below:</p>
        </section>
        
        <form action="#" method="post">
            <div class="form-group">
                <label for="full-name">Your Full Name:</label>
                <input type="text" id="full-name" name="fullName" required minlength="2" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email-address">Your Email Address:</label>
                <input type="email" id="email-address" name="email" required placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label for="phone-number">Your Phone Number:</label>
                <input type="tel" id="phone-number" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">

            <div class="form-group">
                <label for="inquiry-type">Inquiry Reason:</label>
                <select id="inquiry-type" name="inquiryType" required>
                    <option value="">-- Select an option --</option>
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Freelance Web Project</option>
                    <option value="collaboration">Job Opportunity</option>
                </select>
            </div>

                <fieldset class="form-group">
                    <legend>Preferred Contact Method:</legend>
                    <div class="radio-group">
                        <input type="radio" id="pref-email" name="preferredContact" value="email" checked>
                        <label for="pref-email">Email</label>

                        <input type="radio" id="pref-phone" name="preferredContact" value="phone">
                        <label for="pref-phone">Phone</label>
                    </div>
                </fieldset>

            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required minlength="10" placeholder="Enter your message"></textarea>
                </div>

            <button type="submit">Send Message</button>
        </form>
    </main>
    
    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
